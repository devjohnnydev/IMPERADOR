<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Imperador Lounge Bar</title>
  <meta name="description" content="Imperador Lounge Bar — lanches, porções, tabacaria, drinks autorais e a melhor noite da cidade." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="home.css" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>

  <!-- BARRA SUPERIOR DE NAVEGAÇÃO ENTRE OS 3 AMBIENTES DO SISTEMA -->
  <header class="system-switcher-bar">
    <div class="switcher-brand">
      <div class="crown-badge">👑</div>
      <div class="switcher-brand-text">
        <h1 id="topBrandTitle">IMPERADOR LOUNGE BAR</h1>
        <span>Sistema Unificado: Cardápio Digital • Tablet PIX • ERP Admin</span>
      </div>
    </div>

    <nav class="mode-pills" aria-label="Alternar modo do sistema">
      <button class="mode-pill" id="btnModeHome" onclick="ImperadorApp.setViewMode('home')">
        🏠 Site / Home
      </button>
      <button class="mode-pill" id="btnModeMenu" onclick="ImperadorApp.setViewMode('menu')">
        📱 Cardápio Digital (QR)
      </button>
      <button class="mode-pill" id="btnModeTablet" onclick="ImperadorApp.setViewMode('tablet')">
        🖥️ Tablet Moderno (Mesa + PIX)
      </button>
      <button class="mode-pill" id="btnModeAdmin" onclick="ImperadorApp.setViewMode('admin')">
        🔐 Painel administrativo
      </button>
    </nav>

    <div class="switcher-status">
      <div class="table-selector-pill" title="Mesa ativa para pedidos no Cardápio ou Tablet">
        <span>📍 Mesa:</span>
        <select id="globalTableSelect" onchange="ImperadorApp.setSelectedTable(this.value)"></select>
      </div>
      <div class="live-sync-dot" id="syncStatusIndicator">Online • Sincronizado</div>
    </div>
  </header>

  <!-- CONTAINER DE NOTIFICAÇÕES TOAST -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- ÁREA PRINCIPAL RENDERIZADA DINAMICAMENTE -->
  <main id="appRoot"></main>

  <!-- MODAL UNIVERSAL (PERSONALIZAR ITEM / CHECKOUT PIX QR CODE / FORMULÁRIOS ADMIN) -->
  <div id="modalContainer" style="display: none;"></div>

  <script src="icons.js"></script>
  <script src="data.js"></script>
  <script src="admin.js"></script>
  <script src="app.js"></script>
  <script src="home.js"></script>
</body>
</html>
